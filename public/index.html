<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>cpk</title><meta name="theme-color" content="#ff8ac4"><meta name="description" content="Tiny party games for 2-8 friends.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--pink:#ff4a9a;--pink2:#ff8ac4;--blue:#3a9aff;--blue2:#7ad0ff;--yellow:#ffd23a;--green:#2ed47a;--purple:#9a5aff;--orange:#ff8a3a;--red:#ff4a5a;
  --ink:#2a1a4a;--muted:#7a6a9a;--card:#ffffff;--line:#f0e2ff;--shadow:0 6px 0 rgba(90,30,140,.18);--display:"Lilita One","Arial Black",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:var(--body);color:var(--ink);background:#ffd6f0;overscroll-behavior:none}
body{background:linear-gradient(160deg,#ffb8e6 0%,#c9b0ff 45%,#9ae0ff 100%);background-attachment:fixed;min-height:100dvh}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em}
.muted{color:var(--muted)}
.bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-blobs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:float 14s ease-in-out infinite}
.bg-blobs i:nth-child(1){width:260px;height:260px;background:#ffe27a;left:-80px;top:10%}
.bg-blobs i:nth-child(2){width:200px;height:200px;background:#7af0c8;right:-60px;top:40%;animation-delay:-4s}
.bg-blobs i:nth-child(3){width:160px;height:160px;background:#ff8ac4;left:30%;bottom:-60px;animation-delay:-8s}
.bg-blobs i:nth-child(4){width:120px;height:120px;background:#9ab8ff;right:20%;top:-40px;animation-delay:-2s}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.1)}}
.screen{min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.logo{font-family:var(--display);font-size:clamp(5rem,22vw,8rem);line-height:.9;color:#fff;text-shadow:0 6px 0 var(--pink),0 12px 0 rgba(90,30,140,.25);letter-spacing:-.02em;transform:rotate(-4deg);display:inline-block}
.logo.sm{font-size:2.6rem;text-shadow:0 3px 0 var(--pink),0 6px 0 rgba(90,30,140,.2)}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.label{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.label small{text-transform:none;letter-spacing:0;font-weight:700}
/* buttons */
.btn{--c:var(--pink);--d:#c8206a;background:var(--c);color:#fff;font-family:var(--display);font-size:1.15rem;padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 var(--d);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.big{font-size:1.4rem;padding:16px 20px;border-radius:20px}
.btn.small{font-size:.95rem;padding:7px 12px;border-radius:12px;box-shadow:0 3px 0 var(--d)}
.btn.blue{--c:var(--blue);--d:#1a6ad0}.btn.green{--c:var(--green);--d:#16a058}.btn.yellow{--c:var(--yellow);--d:#d0a010;color:var(--ink);text-shadow:none}
.btn.red{--c:var(--red);--d:#c02030}.btn.purple{--c:var(--purple);--d:#6a2ad0}.btn.ghost{--c:#f2eaff;--d:#d8c8f0;color:var(--ink);text-shadow:none}
.icon{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 4px 0 rgba(90,30,140,.18);font-size:1.3rem;display:grid;place-items:center;font-weight:900}
.icon.sm{width:34px;height:34px;font-size:1rem;border-radius:11px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#f2eaff;border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:11px;font-weight:900;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 3px 0 #e0d0f4}
.sw{width:52px;height:30px;border-radius:99px;background:#e0d4f0;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:.2s}
.sw[aria-checked=true]{background:var(--green)}.sw[aria-checked=true]::after{left:25px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.set input[type=range]{flex:1;max-width:200px;accent-color:var(--pink)}
/* auth */
.auth{max-width:420px;margin:0 auto;padding-top:6vh;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tag{font-weight:800;color:#5a2a8a;margin:0}
.auth .card{width:100%;text-align:left}
.auth label{display:flex;flex-direction:column;gap:5px;font-weight:900;font-size:.85rem;color:var(--muted)}
.auth input,.join input,.add-friend input,#chatIn,.dg-in input{border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;font-size:1.05rem;background:#fbf7ff;outline:none;width:100%;min-width:0}
.auth input:focus,.join input:focus,#chatIn:focus,.dg-in input:focus,.add-friend input:focus{border-color:var(--pink2)}
.err{color:var(--red);font-weight:800;margin:0;min-height:1.2em}
/* home */
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto 10px}
.top .logo{margin-right:auto}
.coins{background:#fff;border-radius:14px;padding:8px 12px;font-weight:900;box-shadow:0 4px 0 rgba(90,30,140,.18)}
.home,.room{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.me-card{flex-direction:row;align-items:center}
.mc-bean{flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
.mc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mc-info h2{font-size:1.7rem;overflow-wrap:anywhere}
.lvl{align-self:flex-start;background:var(--purple);color:#fff;font-weight:900;font-size:.8rem;border-radius:9px;padding:2px 9px}
.xpbar{height:12px;background:#f2eaff;border-radius:8px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:8px}
.mc-info small{color:var(--muted);font-weight:700}
.play-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.join{display:flex;gap:8px}.join input{text-align:center;font-family:var(--display);font-size:1.5rem;letter-spacing:.2em;text-transform:uppercase}
.tiles4{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;background:#fff;border-radius:20px;padding:14px 6px;box-shadow:var(--shadow);font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.88rem}
.tile span{font-size:2rem}.tile:active{transform:translateY(3px)}
.tile em{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;font-style:normal;border-radius:99px;min-width:20px;padding:0 6px;font-size:.75rem}
.t1{background:linear-gradient(160deg,#fff,#e0f4ff)}.t2{background:linear-gradient(160deg,#fff,#ffe0f2)}.t3{background:linear-gradient(160deg,#fff,#fff4cc)}.t4{background:linear-gradient(160deg,#fff,#e4ffe8)}
.fm{display:flex;align-items:center;gap:10px}.fm>div{flex:1;min-width:0;display:flex;flex-direction:column}.fm small{color:var(--muted);font-weight:700}.fm b{flex:1}
.dot.on{color:var(--green);font-weight:900;font-size:.8rem}
@media (max-width:560px){.play-btns{grid-template-columns:1fr}.tiles4{grid-template-columns:repeat(3,1fr)}.tile{font-size:.78rem;padding:12px 4px}.tile span{font-size:1.7rem}}
/* room */
.room-code{flex:1;text-align:center;font-family:var(--display);font-size:2.2rem;letter-spacing:.18em;color:#fff;text-shadow:0 4px 0 var(--purple)}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pl{position:relative;background:#fbf7ff;border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border:3px solid transparent}
.pl.me{border-color:var(--pink2);background:#fff0f8}.pl b{font-size:.85rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl small{color:var(--muted);font-weight:800;font-size:.7rem}
.pl.empty{display:grid;place-items:center;min-height:120px;border:3px dashed #e8dcf8;background:transparent}.pl.empty span{font-family:var(--display);font-size:2rem;color:#e0d0f4}
.pl .crown{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:1.4rem;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.pl svg{animation:bob 2.4s ease-in-out infinite}.pl:nth-child(2n) svg{animation-delay:-.6s}.pl:nth-child(3n) svg{animation-delay:-1.2s}
.host-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.g-toggles{display:flex;flex-wrap:wrap;gap:6px}
.gt{border-radius:12px;padding:7px 10px;font-weight:800;font-size:.85rem;background:#f2eaff;border:2px solid transparent}
.gt:not(.off){background:#fff;border-color:currentColor}.gt.off{opacity:.45;text-decoration:line-through}
.cat-phys{color:#e0287a}.cat-draw{color:#7a3ad8}.cat-mash{color:#d06a00}.cat-react{color:#1a8a4a}.cat-race{color:#1a6ad0}.cat-social{color:#c02a2a}
.start-row{display:flex;flex-direction:column;align-items:center;gap:6px}.start-row .btn{width:100%}
@media (max-width:560px){.players{grid-template-columns:repeat(4,1fr);gap:6px}.pl svg{width:42px;height:55px}}
/* modals */
.modal{position:fixed;inset:0;z-index:50;background:rgba(60,20,100,.45);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.panel{background:#fff;border-radius:26px;padding:18px;width:min(460px,100%);max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(90,30,140,.25);animation:popin .25s cubic-bezier(.2,1.4,.4,1)}
.panel.wide{width:min(760px,100%)}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.ph{display:flex;align-items:center;gap:10px}.ph h2{flex:1;font-size:1.6rem}
.opt{text-align:left;background:#fbf7ff;border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:3px}.opt b{font-size:1.15rem}.opt span{color:var(--muted);font-weight:700}
.opt:hover{border-color:var(--pink2)}
.pub-list{display:flex;flex-direction:column;gap:8px}.pub{display:grid;grid-template-columns:1fr auto;text-align:left;background:#fbf7ff;border-radius:16px;padding:12px 14px}.pub span{color:var(--muted);font-weight:700;font-size:.85rem}
.pub em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-family:var(--display);font-size:1.4rem;letter-spacing:.1em;color:var(--purple)}
.ward{display:grid;grid-template-columns:200px 1fr;gap:14px}.ward-prev{display:flex;flex-direction:column;align-items:center;gap:10px;background:radial-gradient(circle at 50% 40%,#fff,#f2e4ff);border-radius:20px;padding:14px}
.ward-prev svg{animation:bob 2.4s ease-in-out infinite}.ward-shop{display:flex;flex-direction:column;gap:10px;min-width:0}
.ward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.wi{position:relative;background:#fbf7ff;border:3px solid var(--line);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:800}
.wi.on{border-color:var(--green);background:#eafff2}.wi.locked{background:#f6f2fa}.wi.locked svg{opacity:.6}.wi span{color:#b07a00;font-weight:900}.wi[data-sure="1"]{border-color:var(--yellow);background:#fff8dc}
@media (max-width:560px){.ward{grid-template-columns:1fr}.ward-prev svg{width:110px;height:143px}}
.add-friend{display:flex;gap:8px}.f-list{display:flex;flex-direction:column;gap:8px}
.freq{display:flex;align-items:center;gap:8px;background:#fff8dc;border-radius:14px;padding:8px 10px;flex-wrap:wrap}.freq b{margin-right:auto}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat-grid div{background:#fbf7ff;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center}.stat-grid b{font-family:var(--display);font-size:1.6rem;font-weight:400}.stat-grid span{color:var(--muted);font-weight:800;font-size:.75rem}
.best{margin:0;font-weight:700}.g-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.g-stats div{display:flex;justify-content:space-between;background:#fbf7ff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.88rem}
.hist{display:flex;flex-direction:column;gap:6px}.h-row{display:flex;align-items:center;gap:10px;background:#fbf7ff;border-radius:14px;padding:8px 10px}.h-row>div{flex:1;min-width:0;display:flex;flex-direction:column}.h-row small{color:var(--muted);font-weight:700;font-size:.75rem}
.h-place{font-family:var(--display);font-size:1.2rem;width:48px;text-align:center}.h-place.p1{color:#d0a010}.h-place.p2{color:#8a9aaa}.h-place.p3{color:#c07a3a}.h-r{text-align:right;font-weight:900;display:flex;flex-direction:column}
.pm-head{display:flex;align-items:center;gap:12px}
/* chat + emotes */
.chat{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.chat>*{pointer-events:auto}
.chat-row{display:flex;gap:8px;align-items:center;position:relative}
.emotes{position:absolute;right:0;bottom:calc(100% + 8px);display:grid;grid-template-columns:repeat(4,42px);gap:4px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 6px 0 rgba(90,30,140,.2)}
.emotes button{font-size:1.4rem;width:42px;height:40px;border-radius:12px}.emotes button:active{background:#ffe0f2;transform:scale(1.2)}
.chat-btn{position:relative;width:52px;height:52px;border-radius:50%;background:var(--pink);box-shadow:0 5px 0 #c8206a;font-size:1.5rem}
.emo-btn{background:var(--yellow);box-shadow:0 5px 0 #d89a00}
/* in a match: sit top-right under the score bar so nothing covers controls or inputs */
.match:not([hidden]) ~ .chat{top:max(8px,env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right,0px));bottom:auto}
.match:not([hidden]) ~ .chat .chat-row{gap:6px}.match:not([hidden]) ~ .chat .chat-btn{width:38px;height:38px;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}.match:not([hidden]) ~ .chat .chat-btn em{min-width:18px;font-size:.7rem}
.match:not([hidden]) ~ .chat .emotes{bottom:auto;top:calc(100% + 8px)}
.match:not([hidden]) ~ .chat .chat-panel{bottom:auto;top:calc(56px + env(safe-area-inset-top,0px));height:min(300px,42dvh)}
.chat-btn em{position:absolute;top:-2px;right:-2px;background:var(--yellow);color:var(--ink);font-style:normal;font-weight:900;border-radius:99px;min-width:22px;font-size:.8rem;padding:0 6px}
.chat-panel{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:84px;width:min(340px,calc(100vw - 24px));height:min(380px,55dvh);background:#fff;border-radius:22px;box-shadow:0 8px 0 rgba(90,30,140,.25);display:flex;flex-direction:column;padding:10px;gap:8px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;min-height:0}
.cm{display:flex;align-items:flex-start;gap:5px;font-size:.92rem;overflow-wrap:anywhere}.cm b{color:var(--purple);white-space:nowrap}.cm.mine b{color:var(--pink)}.cm.sys{color:var(--muted);font-weight:700;font-size:.8rem;justify-content:center}
.cm svg{flex:0 0 auto}
#chatForm{display:flex;gap:6px}#chatIn{padding:9px 12px;font-size:.95rem}
.emo-pops{position:fixed;inset:0;pointer-events:none;z-index:45}
.emo-pop{position:absolute;bottom:90px;display:flex;flex-direction:column;align-items:center;animation:rise 2.4s ease-out forwards}.emo-pop span{font-size:3rem}.emo-pop small{background:#fff;border-radius:8px;padding:0 6px;font-weight:900}
@keyframes rise{to{transform:translateY(-55vh) scale(1.3);opacity:0}}
/* match */
.match{padding:0;position:relative;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.m-top{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:flex;align-items:center;gap:8px;pointer-events:none}
.m-top>*{pointer-events:auto}
#mRound{background:rgba(255,255,255,.9);border-radius:12px;padding:5px 10px;font-weight:900;font-size:.85rem}
.m-time{margin:0 0 0 6px;font-family:var(--display);font-size:1.8rem;color:#fff;text-shadow:0 3px 0 rgba(90,30,140,.5)}
#mBoard{margin-left:auto}
.stage{position:absolute;inset:0;overflow:hidden}
.stage3d{display:block;touch-action:none}
.labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag3d{position:absolute;left:0;top:0;background:rgba(255,255,255,.88);border-radius:8px;padding:1px 7px;font-weight:900;font-size:.72rem;white-space:nowrap}
.tag3d.me{background:var(--yellow)}
.emo3d{position:absolute;left:0;top:0;font-size:2.2rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.ovl{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:60px 14px 20px;overflow-y:auto}
.vote-ovl,.result-ovl,.final-ovl{background:linear-gradient(160deg,rgba(255,184,230,.96),rgba(201,176,255,.96) 50%,rgba(154,224,255,.96))}
.intro-ovl{background:rgba(42,26,74,.55);backdrop-filter:blur(4px)}
.vote,.result,.final{width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.vote h2,.result h2{font-size:2rem;color:#fff;text-shadow:0 4px 0 var(--purple)}
.vote-t{font-family:var(--display);font-size:2.4rem;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 0 rgba(90,30,140,.2)}
.vote-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.vote-card{background:#fff;border-radius:22px;padding:16px 10px;box-shadow:0 6px 0 rgba(90,30,140,.2);display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid transparent;transition:transform .15s}
.vote-card:hover{transform:translateY(-3px)}.vote-card.mine{border-color:currentColor;transform:scale(1.04)}
.vc-ic{font-size:3rem}.vote-card b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--ink)}.vote-card small{color:var(--muted);font-weight:700;font-size:.8rem}
.vc-who{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:26px}
@media (max-width:560px){.vote-opts{grid-template-columns:1fr}.vote-card{flex-direction:row;text-align:left;padding:10px 12px}.vote-card .vc-ic{font-size:2.2rem}.vote-card small{display:none}.vc-who{margin-left:auto}}
.mini-board{background:rgba(255,255,255,.85);border-radius:18px;padding:8px;width:min(420px,100%);display:flex;flex-direction:column;gap:3px}
.mb-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:2px 6px;border-radius:10px}.mb-row.me{background:#fff4c8}.mb-row b{flex:1;text-align:left}.mb-p{width:20px;color:var(--muted)}.mb-s{font-family:var(--display);font-size:1.1rem}
.intro{background:#fff;border-radius:28px;padding:22px;width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 10px 0 rgba(42,26,74,.35);animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
.in-ic{font-size:4rem;animation:bob 1.6s ease-in-out infinite}.intro h1{font-size:2.4rem;color:currentColor}
.intro ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--ink);font-weight:700}
.intro li{background:#fbf7ff;border-radius:12px;padding:8px 12px}
.in-note{margin:0;background:#fff4c8;border-radius:12px;padding:8px 12px;font-weight:800;color:var(--ink)}
.count{font-family:var(--display);font-size:3.4rem;color:var(--pink);min-height:1.1em}.count.pop{animation:cpop .5s}
@keyframes cpop{from{transform:scale(2.2);opacity:0}}
.rr-list{background:#fff;border-radius:22px;padding:10px;width:min(420px,100%);display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 0 rgba(90,30,140,.2)}
.rr{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:12px;font-weight:800;animation:slidein .4s backwards}.rr.me{background:#fff4c8}
.rr:nth-child(2){animation-delay:.08s}.rr:nth-child(3){animation-delay:.16s}.rr:nth-child(4){animation-delay:.24s}.rr:nth-child(5){animation-delay:.32s}.rr:nth-child(6){animation-delay:.4s}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}}
.rr b{flex:1;text-align:left}.rr-p{width:30px;font-size:1.3rem}.rr-g{font-family:var(--display);font-size:1.3rem;color:var(--green)}
.final h1{font-size:2.6rem;color:#fff;text-shadow:0 5px 0 var(--pink)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;width:min(130px,30%);font-weight:900}.pod span{color:var(--muted);font-size:.85rem}
.pod-step{width:100%;background:#fff;border-radius:14px 14px 0 0;font-family:var(--display);font-size:2rem;display:grid;place-items:center;box-shadow:0 6px 0 rgba(90,30,140,.2)}
.p1 .pod-step{height:120px;background:linear-gradient(#ffe27a,#ffc23a)}.p2 .pod-step{height:85px;background:linear-gradient(#f2f2f8,#d0d4e0)}.p3 .pod-step{height:60px;background:linear-gradient(#ffd0a8,#e8a070)}
.pod-b svg{animation:bob 1.4s ease-in-out infinite}.pod.empty{visibility:hidden}
.fin-list{display:flex;flex-direction:column;gap:3px;width:min(420px,100%)}.fin-me{margin:0;background:#fff;border-radius:14px;padding:8px 14px;font-weight:800}
/* controls */
.controls{position:absolute;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));pointer-events:none}
.pad{width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.7);position:relative;pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(90,30,140,.3)}
.act{width:96px;height:96px;border-radius:50%;background:var(--pink);color:#fff;font-family:var(--display);font-size:1.2rem;box-shadow:0 6px 0 #c8206a;pointer-events:auto;touch-action:none;margin-right:70px}
.act.on{transform:translateY(5px);box-shadow:0 1px 0 #c8206a}
@media (hover:hover) and (pointer:fine){.controls{opacity:.55}}
.bomb-hud{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(42,26,74,.35);border-radius:14px;padding:3px 12px;display:flex;flex-direction:column;align-items:center;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
.bomb-hud.me b{font-family:var(--display);font-size:1.8rem;color:#ffe23a;animation:shake .3s infinite}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
/* draw game */
.dg{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:56px 12px 12px}
.dg-top{grid-column:1/3;text-align:center;font-weight:900;font-size:1.15rem;background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 0 rgba(90,30,140,.15)}
.dg-word{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--pink);letter-spacing:.04em}
.dg-blank{font-family:var(--display);letter-spacing:.2em;font-size:1.4rem}
.dg-board{position:relative;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;min-height:0}
#dgCan{aspect-ratio:1;max-width:100%;max-height:calc(100% - 52px);background:#fff;border-radius:20px;box-shadow:0 6px 0 rgba(90,30,140,.2);touch-action:none;cursor:crosshair}
.pad-tools{flex:none;display:flex;gap:6px;background:rgba(255,255,255,.95);border-radius:14px;padding:5px;box-shadow:0 3px 0 rgba(90,30,140,.18)}
.pt{padding:7px 11px;border-radius:10px;font-weight:900;font-size:.9rem;color:var(--ink);white-space:nowrap}.pt.on{background:var(--pink);color:#fff}
canvas.erasing{cursor:cell}
.dg-pen{position:absolute;pointer-events:none;color:#c8b8e0;font-weight:900;font-size:1.3rem}
.dg-side{display:flex;flex-direction:column;gap:8px;min-height:0;background:#fff;border-radius:20px;padding:10px;box-shadow:0 6px 0 rgba(90,30,140,.2)}
.dg-feed{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.dgf{display:flex;align-items:center;gap:5px;font-size:.9rem;overflow-wrap:anywhere}.dgf b{color:var(--purple)}.dgf.ok{background:#e4ffee;border-radius:10px;padding:3px 6px;font-weight:800}
.dg-in{display:flex;gap:6px}
@media (max-width:700px){.dg{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) 170px}.dg-top{grid-column:1}}
/* tug */
.tug{position:absolute;inset:0;display:flex;flex-direction:column}
#tugCan{flex:1;width:100%;min-height:0;display:block}
.tug-ui{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}
.tug-count{background:rgba(255,255,255,.9);border-radius:12px;padding:4px 12px;font-weight:900}
.mash{width:min(260px,70vw);height:110px;border-radius:30px;font-family:var(--display);font-size:2.6rem;color:#fff;touch-action:manipulation;user-select:none}
.mash.pink{background:var(--pink);box-shadow:0 8px 0 #c8206a}.mash.blue{background:var(--blue);box-shadow:0 8px 0 #1a6ad0}
.mash.hit{animation:mhit .12s}@keyframes mhit{50%{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.2)}}
/* red */
.redg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 14px 14px}
.red-top{display:flex;gap:20px;font-family:var(--display);font-size:2rem;color:#fff;text-shadow:0 3px 0 rgba(90,30,140,.4)}
.red-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(420px,88vw,60dvh)}
.rb{aspect-ratio:1;border-radius:24px;background:#fff;box-shadow:0 7px 0 rgba(90,30,140,.25);transition:background .08s,transform .08s;touch-action:manipulation}
.rb.on-g{background:radial-gradient(circle at 35% 30%,#8affb8,#16c060);box-shadow:0 7px 0 #0a8a40;transform:scale(1.03)}
.rb.on-r{background:radial-gradient(circle at 35% 30%,#ff9a9a,#e01a2a);box-shadow:0 7px 0 #a00a1a;transform:scale(1.03)}
.rb.good{animation:good .25s}.rb.boom{background:#1a1a24!important}
@keyframes good{50%{transform:scale(.9)}}
.red-board{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:520px}.red-board span{background:rgba(255,255,255,.88);border-radius:10px;padding:2px 8px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:4px}
.red-board span.dead{opacity:.45;text-decoration:line-through}.red-board span.me{background:#fff4c8}
.red-out{position:absolute;inset:0;background:rgba(42,26,74,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:6px}.red-out b{font-family:var(--display);font-size:4rem;font-weight:400}
/* misc */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-weight:800;border-radius:16px;padding:10px 16px;max-width:90vw;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.toast.show{animation:popin .25s cubic-bezier(.2,1.4,.4,1)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.bean{overflow:visible}

.act kbd{display:block;font:900 .7rem var(--body,sans-serif);opacity:.8;margin-top:2px;letter-spacing:.05em}

/* ===== no blue highlight / text selection when tapping on phones ===== */
*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.chat-msgs,.chat-msgs *{-webkit-user-select:text;user-select:text}

/* ===== shared bits for the new games ===== */
.race-hud{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;color:#fff;background:rgba(42,26,74,.4);border-radius:16px;padding:4px 14px;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;font-weight:900;white-space:nowrap}
.race-hud b{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1}
.hearts{font-size:.7rem;letter-spacing:-2px}
.chip{display:inline-flex;align-items:center;gap:3px;font-weight:900;vertical-align:middle}
.mash.green{background:var(--green,#2ecc71);box-shadow:0 8px 0 #1a9a50}.mash.bad{animation:shake .3s;background:#ff5a5a}
.mash.red-btn{background:#ff3a5a;box-shadow:0 8px 0 #b81a38}.mash:disabled{opacity:.45}
/* climb */
.climb{position:absolute;inset:0}.climb canvas{width:100%;height:100%;display:block}
.cl-ui{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.cl-bar{position:relative;width:min(320px,80vw);height:26px;border-radius:13px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);overflow:hidden}
.cl-bar .z1{position:absolute;left:30%;width:40%;top:0;bottom:0;background:#9af0a8}.cl-bar .z2{position:absolute;left:43%;width:14%;top:0;bottom:0;background:#2ecc71}
.cl-bar b{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
/* telephone + fake artist */
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 12px 12px}
.pg-top{background:#fff;border-radius:16px;padding:9px 16px;font-weight:900;text-align:center;box-shadow:0 4px 0 rgba(90,30,140,.15);max-width:100%}
.pg-t{display:inline-block;min-width:30px;background:var(--yellow);border-radius:10px;padding:0 6px;margin-left:4px}
.pg-main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pg-board{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pg-board canvas{aspect-ratio:1;max-width:100%;max-height:calc(100% - 52px);background:#fff;border-radius:20px;box-shadow:0 6px 0 rgba(90,30,140,.2);touch-action:none}
.pg-empty{position:absolute;font-weight:900;color:var(--muted)}
.pg-form{width:min(460px,100%)}.pg-locked{background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin:0;text-align:center}
.pg-wait{background:rgba(255,255,255,.9);border-radius:18px;padding:18px 22px;font-weight:900;font-size:1.1rem;text-align:center}
.pg-rev{width:100%;height:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px;align-content:start}
.pg-card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 5px 0 rgba(90,30,140,.18);border:3px solid #ff8aa8}.pg-card.ok{border-color:#2ecc71}
.pg-card canvas{width:100%;aspect-ratio:1;display:block;border-radius:12px;background:#fff}.pg-cap{font-size:.9rem;padding:6px 2px 0;line-height:1.5}
.fa-turn{min-height:26px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);text-align:center}
.fa-fake{color:#ff2a6a}
.fa-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.fa-leg span{display:flex;align-items:center;gap:3px;background:#fff;border-radius:10px;padding:2px 8px;font-weight:800;font-size:.8rem;border-bottom:4px solid var(--c)}
.fa-vote{position:absolute;inset:0;z-index:6;background:rgba(42,26,74,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 14px 14px;color:#fff;text-align:center}
.fa-vote h2{font-size:2rem;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.fa-vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:min(560px,100%)}
.fa-vb{background:#fff;color:var(--ink);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:6px solid var(--c);font-weight:900}.fa-vb.mine{outline:4px solid var(--yellow);transform:scale(1.04)}
.fa-reveal{background:#fff;color:var(--ink);border-radius:22px;padding:14px 22px;display:flex;flex-direction:column;align-items:center}.fa-reveal p{margin:4px 0;font-weight:800}
.fa-tally{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.fa-tally span{background:#fff;color:var(--ink);border-radius:10px;padding:3px 8px}
/* most likely to */
.lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 14px 14px}
.lk-q{background:#fff;border-radius:22px;padding:16px 20px;font-size:1.3rem;font-weight:800;text-align:center;max-width:560px;box-shadow:0 6px 0 rgba(90,30,140,.2)}.lk-q small{display:block;color:var(--muted);font-size:.8rem}.lk-q b{color:var(--pink)}
.lk-t{font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.lk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;width:min(600px,100%)}
.lk-b{position:relative;background:#fff;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;box-shadow:0 5px 0 rgba(90,30,140,.18)}
.lk-b.self{opacity:.55}.lk-b.mine{outline:4px solid var(--pink)}.lk-b.win{background:#fff4b8;outline:4px solid var(--yellow)}
.lk-crown{position:absolute;top:-14px;font-size:1.6rem}.lk-n{font-size:.8rem;color:var(--muted)}.lk-v{display:flex;flex-wrap:wrap;justify-content:center}
/* balloon */
.bl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;padding:58px 12px max(18px,env(safe-area-inset-bottom))}
.bl.shake{animation:shake .3s}
.bl-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.bl-mini{display:flex;flex-direction:column;align-items:center;font-size:.7rem;font-weight:800;background:rgba(255,255,255,.75);border-radius:12px;padding:3px 6px}.bl-mini.me{background:#fff4c8}
.bl-mb{width:26px;height:30px;display:grid;place-items:center}.bl-mb::before{content:"";width:24px;height:28px;border-radius:50%;background:var(--c);transform:scale(var(--s));transition:transform .15s}.bl-mb:not(:empty)::before{display:none}
.bl-light{font-family:var(--display);font-size:2rem;color:#fff;background:#2ecc71;border-radius:18px;padding:4px 22px;box-shadow:0 5px 0 rgba(0,0,0,.2)}.bl-light.red{background:#ff2a4a;animation:shake .3s infinite}
.bl-big{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}.bl-big svg{height:100%;max-height:340px}
.bl-pct{position:absolute;bottom:0;font-family:var(--display);font-size:1.8rem;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
/* sprint */
.sp{position:absolute;inset:0}.sp canvas{width:100%;height:100%;display:block}
.sp-call{position:absolute;top:34%;left:0;right:0;text-align:center;font-family:var(--display);font-size:2.4rem;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none}.sp-call.bang{font-size:3.6rem;color:#ffe23a}
.sp-btns{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;padding:0 12px}.sp-btns .mash{width:min(170px,44vw);height:96px;font-size:1.8rem}
/* stop at 10 */
.st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 14px 14px}
.st-try{font-weight:900;font-size:1.1rem;background:#fff;border-radius:14px;padding:6px 14px}
.st-clock{font-family:var(--display);font-size:clamp(4rem,20vw,7.5rem);color:#fff;text-shadow:0 6px 0 rgba(90,30,140,.4);line-height:1;font-variant-numeric:tabular-nums}
.st-clock.blind{opacity:.5}.st-clock.done{color:#ffe23a}
.st-msg{font-weight:900;color:#fff;min-height:1.4em;text-shadow:0 2px 0 rgba(0,0,0,.3);font-size:1.15rem}
/* whack a mole */
.wm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 12px 12px}
.wm-score{font-family:var(--display);font-size:2.2rem;color:#fff;text-shadow:0 3px 0 rgba(90,30,140,.4)}
.wm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(480px,94vw,70dvh)}
.wm-h{aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,#5a3a1a 55%,#7a5a2a 56%);position:relative;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);touch-action:manipulation;font-size:2rem}
.wm-m{position:absolute;inset:0;display:grid;place-items:center;transform:translateY(100%);transition:transform .08s}
.wm-h.up .wm-m,.wm-h.got .wm-m{transform:none}
.wm-h.t0 .wm-m{background:radial-gradient(circle at 50% 60%,#c08a5a 48%,transparent 49%)}.wm-h.t1 .wm-m{background:radial-gradient(circle at 50% 60%,#ffd23a 48%,transparent 49%)}.wm-h.t2 .wm-m{background:radial-gradient(circle at 50% 60%,#3a3a4a 48%,transparent 49%)}
.wm-face{width:40%;height:24%;margin-top:10%;background:radial-gradient(circle at 25% 30%,#1a1030 14%,transparent 16%),radial-gradient(circle at 75% 30%,#1a1030 14%,transparent 16%),radial-gradient(ellipse at 50% 85%,#ff8aa8 22%,transparent 24%)}
.wm-h.bonk{transform:scale(.92)}.wm-who{display:grid;place-items:center}
/* quick draw */
.qd{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 12px 12px}
.qd-sky{position:absolute;inset:0;background:linear-gradient(#ffb04a,#ff7a5a 60%,#e8a060 60%,#c87a40);z-index:-1}.qd.go .qd-sky{background:linear-gradient(#ff4a4a,#ff2a6a 60%,#e8a060 60%,#c87a40)}
.qd-sun{position:absolute;top:18%;width:120px;height:120px;border-radius:50%;background:#ffe86a;z-index:-1;box-shadow:0 0 60px #fff6a0}
.qd-k{font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.qd-call{font-family:var(--display);font-size:clamp(2.6rem,12vw,4.5rem);color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.35);min-height:1.2em}.qd-call.draw{color:#ffe23a;animation:shake .2s infinite}.qd-call.bad{color:#ffd0d0}
.qd-me{position:relative}.qd-hat{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:3rem}
.qd .mash{background:#3a2a1a;box-shadow:0 8px 0 #1a1008}
.race-hud:empty,.bomb-hud:empty{display:none}

/* ===== season pass ===== */
.wi.ex{background:linear-gradient(160deg,#fff,#fff2c8)}.wi-ex{position:absolute;top:4px;left:4px;font-style:normal;font-size:.62rem;font-weight:900;background:var(--purple);color:#fff;border-radius:6px;padding:0 4px}
.ps-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ps-tier{display:flex;flex-direction:column;align-items:center;background:var(--purple);color:#fff;border-radius:18px;padding:6px 14px;line-height:1}.ps-tier b{font-family:var(--display);font-weight:400;font-size:2.2rem}.ps-tier small{font-weight:800;font-size:.7rem;opacity:.85}
.ps-prog{flex:1;min-width:160px}.ps-prog small{font-weight:700;color:var(--muted)}
.ps-buy{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#fff4c8,#ffe0f2);border-radius:16px;padding:10px 12px;margin:10px 0}.ps-buy div{display:flex;flex-direction:column}.ps-buy small{color:var(--muted);font-weight:700}
.ps-prem{margin:10px 0;font-weight:900}.ps-prem.on{color:#b07800}
.ps-wrap{display:flex;gap:6px;align-items:stretch}
.ps-labels{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-bottom:10px;font-weight:900;font-size:.72rem;color:var(--muted)}.ps-labels span{height:96px;display:flex;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg)}
.ps-track{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-behavior:smooth}

.im-pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.im-cl{display:flex;flex-wrap:wrap;gap:4px}.im-cl span{background:#efe4ff;border-radius:8px;padding:1px 8px;font-weight:800;font-size:.9rem}.im-cl i{color:var(--muted)}

// ---------- FALLING TILES ----------
// two floors: drop through the top one and you land on the one below. Fall off the bottom and you're out
const TN = 9, TS = 2, NN = TN*TN, LY = [0, -5];
// the tile under a point (the thin seams between tiles count as the nearest tile, so you never drop through a crack)
const tileAt = (x, z) => { const i = Math.round(x / TS + (TN - 1)/2), j = Math.round(z / TS + (TN - 1)/2); if(i < 0 || j < 0 || i >= TN || j >= TN) return -1; return j*TN + i; };
const tileX = k => (k % TN - (TN-1)/2)*TS, tileZ = k => (Math.floor(k / TN) - (TN-1)/2)*TS;
const solidAt = (G, L, x, z) => { const s1 = (px, pz) => { const k = tileAt(px, pz); return k >= 0 && G.T[L*NN + k] !== -1; }; return s1(x, z) || s1(x + .25, z) || s1(x - .25, z) || s1(x, z + .25) || s1(x, z - .25); };
GAMES.tiles = {
  name:"Falling Tiles", icon:"🧇", cat:"phys", desc:"Tiles drop after you step on them", dur:55,
  how:["Every tile you touch wobbles, then falls. Keep moving!","Fall through and you land on the floor below: a second chance","Fall off the bottom floor and you're out. Last bean standing wins. <b>DIVE</b> (or <b>E</b>) across gaps!"],
  init(ids){ const B = physInit(ids, (i, n) => { const a = i / n * Math.PI * 2; return [Math.cos(a)*5.2, Math.sin(a)*5.2]; }); ids.forEach(id => B[id].layer = 0); return { T:Array(NN*2).fill(0), B, outs:[], rt:0 }; },
  tick(G, dt, inp, H){
    G.ids.forEach(id => { const b = G.B[id]; if(!b.alive || b.fall || b.dash > 0) return; const k = tileAt(b.x, b.z), i = b.layer*NN + k; if(k >= 0 && G.T[i] === 0 && G.t > .8){ G.T[i] = 1; G.dirty = true; } });
    for(let k=0;k<G.T.length;k++) if(G.T[k] > 0){ G.T[k] -= dt; if(G.T[k] <= 0){ G.T[k] = -1; G.dirty = true; } }
    if(G.t > 18){ G.rt -= dt; if(G.rt <= 0){ G.rt = Math.max(.3, 1.4 - (G.t - 18) * .03); const solid = G.T.map((v, k) => v === 0 ? k : -1).filter(k => k >= 0); if(solid.length) G.T[pick(solid)] = 1.1; } }
    physStep(G, dt, inp, { ground:(x, z, b) => b.dash > 0 || solidAt(G, b.layer, x, z), speed:6.3, outY:-13 });
    G.ids.forEach(id => { const b = G.B[id]; if(b.alive && b.fall && b.layer === 0 && b.y <= LY[1] && b.y > LY[1] - 1.2 && solidAt(G, 1, b.x, b.z)){ b.fall = false; b.y = LY[1]; b.vy = 0; b.layer = 1; b.vx *= .3; b.vz *= .3; fxp(G, "l", id); } });
    if(G.ids.filter(id => G.B[id].alive).length <= 1 && G.t > 1) H.end(outRank(G)); },
  timeout(G){ const alive = G.ids.filter(id => G.B[id].alive), top = alive.filter(id => G.B[id].layer === 0), bot = alive.filter(id => G.B[id].layer === 1); return [top, bot].filter(g => g.length).concat(G.outs.slice().reverse().map(id => [id])); },
  drop(G, id){ if(G.B[id] && G.B[id].alive){ G.B[id].alive = false; G.outs.push(id); } },
  bot(G, id){ const b = G.B[id]; if(!b || !b.alive || b.fall) return null; const L = b.layer;
    const ok = k => k >= 0 && G.T[L*NN + k] === 0, gone = k => k < 0 || G.T[L*NN + k] === -1 || G.T[L*NN + k] > 0 && G.T[L*NN + k] < .5;
    const clear = (x0, z0, x1, z1) => { for(let i=2;i<=8;i++) if(gone(tileAt(lerp(x0, x1, i/8), lerp(z0, z1, i/8)))) return false; return true; };

  snap(G){ return { B:physSnap(G.B), T:G.T.map(v => v === -1 ? "x" : v > 0 ? "s" : "o").join(""), fx:G.fx }; },
  view(root, ctx){ return physView(root, ctx, { sky:"#9ae8ff", sky2:"#fff0c8", goo:"#7ad8ff", fog:"#fff0c8", cam:[0, 20, 16], look:[0, -1.5, 1], pred:{ speed:6.3 } }, (S, v) => {

      m.position.set(tileX(kk), LY[L] - .25, tileZ(kk)); m.receiveShadow = true; m.castShadow = L === 0; S.scene.add(m); tiles.push({ m, st:"o", vy:0, base:m.material.color.clone(), x:tileX(kk) }); }
    v.tick = (s, dt) => { for(let k=0;k<tiles.length;k++){ const T = tiles[k], st = s.T[k];
      if(st === "s"){ T.m.position.x = T.x + (rand() - .5)*.12; T.m.material.color.copy(T.base).lerp(new THREE.Color("#ffffff"), .45); }
      if(st === "x" && T.st !== "x"){ T.vy = 0; if(rand() < .3) sfx.pop(); }
      if(st === "x" && T.m.visible){ T.vy -= 25*dt; T.m.position.y += T.vy*dt; T.m.rotation.x += dt*1.5; if(T.m.position.y < -16) T.m.visible = false; }

    v.onFx = (type, a) => { if(type === "l"){ sfx.bump(); if(a === ctx.me) toast("Phew! Bottom floor, last chance 😬", 1600); } else physFx(type, a); };
  }); }

  rankOf(G){ const ids = G.ids.filter(id => G.res[id]), key = id => { const r = G.res[id]; return (r.out == null ? 1e6 : r.out * 1000) + r.s; };

      x.fillStyle = "#9ad8ff"; x.fillRect(0, 0, W, top); x.fillStyle = "#7ad86a"; x.fillRect(0, top - 10, W, 10);
      [0, 1].forEach(tm => { const y = top + tm*lh; x.fillStyle = tm ? "#3a7ad8" : "#d84a7a"; x.fillRect(0, y, W, lh); x.fillStyle = "rgba(255,255,255,.7)"; x.fillRect(0, y, W, 2);
        for(let l=1;l<=LEGS;l++){ const px = pad + l*LEG*ppm; x.fillStyle = l === LEGS ? "#fff" : "rgba(255,255,255,.5)"; x.fillRect(px - 1, y, l === LEGS ? 4 : 2, lh); }
        const r = s.R[tm], px = pad + v.dd[tm]*ppm, sz = Math.min(lh*.9, 52), bob = r.v > .5 ? Math.abs(Math.sin(t*r.v*1.6))*sz*.12 : 0, im = beanImg(v.imgs, r.cur);
        if(im.complete){ x.drawImage(im, px - sz/2, y + lh*.5 - sz*.75 - bob, sz, sz*1.3); } x.fillStyle = "#ffd23a"; x.fillRect(px + sz*.3, y + lh*.5 - 4 - bob, 14, 6);
        x.font = "bold 12px Nunito, sans-serif"; x.fillStyle = "#fff"; x.textAlign = "left"; x.fillText(`${TEAM_NAME[tm]} · leg ${Math.min(r.li + 1, LEGS)}/${LEGS}: ${r.cur}${r.done ? " 🏁" : ""}`, 6, y + 14); });
      x.fillStyle = "#e8d8b0"; x.fillRect(0, top + lh*2, W, H - top - lh*2); };
    v.destroy = () => removeEventListener("keydown", key); return v; }
};

  if(!PASSI) return; const P = ME.pass, t = passTier(), into = P.xp - t * PASSI.txp, maxed = t >= PASSI.tiers, cl = passClaimable();

    ${P.prem ? `<p class="ps-prem on">⭐ Premium unlocked</p>` : `<div class="ps-buy"><div><b>⭐ Unlock Premium</b><small>9 exclusive items + loads more coins. Pays for itself!</small></div><button class="btn yellow" id="psBuy">🪙 ${fmt(PASSI.price)}</button></div>`}
    <div class="ps-wrap"><div class="ps-labels"><span>Free</span><span>⭐ Premium</span></div><div class="ps-track" id="psTrack">${PASSI.free.map((r, i) => `<div class="ps-col ${i + 1 <= t ? "reach" : ""} ${i + 1 === t + 1 ? "next" : ""}"><div class="ps-n">${i + 1}</div>${col(r, "free", i + 1)}${col(PASSI.prem[i], "prem", i + 1)}</div>`).join("")}</div></div>
    <p class="muted ps-note">Season 1 items will never come back after the season ends.</p>`;

  const cb = $("#psClaim"); if(cb) cb.onclick = async () => { const j = await api("pass", { action:"claim" }); if(j.error) return toast(j.error); ME = j.me; sfx.coin(); confetti(); toast(gotText(j.got)); renderPass(false); renderHome(); };

}
function gotText(got){ const c = got.reduce((s, r) => s + (r.coins || 0), 0), items = got.filter(r => r.item).map(r => ITEMS[r.item].n); return [c ? `+${fmt(c)} coins` : "", items.length ? "New: " + items.join(", ") : ""].filter(Boolean).join(" · ") || "Claimed!"; }
$("#hPass").onclick = async () => { sfx.click(); if(!PASSI) await refreshMe(); modal("#passModal"); renderPass(); };
// ---------- daily spin ----------
const SPIN_COLS = ["#ff4a8a", "#ffd23a", "#3ab8ff", "#5ae07a", "#9a6aff", "#ff8a3a", "#ff3a5a", "#2ad8c8"];
function wheelSVG(){ const n = SPINL.length, a = 360 / n, P = (deg, r) => [100 + Math.sin(deg * Math.PI / 180) * r, 100 - Math.cos(deg * Math.PI / 180) * r];
  return `<svg viewBox="0 0 200 200">${SPINL.map((x, i) => { const [x1, y1] = P(i * a, 96), [x2, y2] = P((i + 1) * a, 96), [tx, ty] = P(i * a + a/2, 64);
    return `<path d="M100 100 L${x1} ${y1} A96 96 0 0 1 ${x2} ${y2} Z" fill="${SPIN_COLS[i % 8]}" stroke="#fff" stroke-width="2"/><text x="${tx}" y="${ty}" transform="rotate(${i * a + a/2} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" font-family="Lilita One, sans-serif" font-size="${x.pxp ? 11 : 14}" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width=".6">${x.pxp ? "⭐ " + x.pxp + "XP" : "🪙" + x.coins}</text>`; }).join("")}<circle cx="100" cy="100" r="16" fill="#fff" stroke="#2a1a4a" stroke-width="3"/><text x="100" y="101" text-anchor="middle" dominant-baseline="middle" font-size="13">🎉</text></svg>`; }
let spinRot = 0;

  setTimeout(() => { ME = j.me; const p = SPINL[j.i]; sfx.win(); confetti(); toast(p.pxp ? `⭐ +${p.pxp} season pass XP!` : `🪙 You won ${p.coins} coins!`, 3200); SND.say(p.coins >= 250 ? "Jackpot!" : "Nice!"); renderSpin(); renderHome(); }, 4400); };

})();</script></body></html>
