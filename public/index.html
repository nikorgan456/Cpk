<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>cpk</title><meta name="theme-color" content="#ff8ac4"><meta name="description" content="Tiny party games for 2-8 friends.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--pink:#ff4a9a;--pink2:#ff8ac4;--blue:#3a9aff;--blue2:#7ad0ff;--yellow:#ffd23a;--green:#2ed47a;--purple:#9a5aff;--orange:#ff8a3a;--red:#ff4a5a;
  --ink:#2a1a4a;--muted:#7a6a9a;--card:#ffffff;--line:#f0e2ff;--shadow:0 6px 0 rgba(90,30,140,.18);--display:"Lilita One","Arial Black",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:var(--body);color:var(--ink);background:#ffd6f0;overscroll-behavior:none}
body{background:linear-gradient(160deg,#ffb8e6 0%,#c9b0ff 45%,#9ae0ff 100%);background-attachment:fixed;min-height:100dvh}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em}
.muted{color:var(--muted)}
.bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-blobs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:float 14s ease-in-out infinite}
.bg-blobs i:nth-child(1){width:260px;height:260px;background:#ffe27a;left:-80px;top:10%}
.bg-blobs i:nth-child(2){width:200px;height:200px;background:#7af0c8;right:-60px;top:40%;animation-delay:-4s}
.bg-blobs i:nth-child(3){width:160px;height:160px;background:#ff8ac4;left:30%;bottom:-60px;animation-delay:-8s}
.bg-blobs i:nth-child(4){width:120px;height:120px;background:#9ab8ff;right:20%;top:-40px;animation-delay:-2s}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.1)}}
.screen{min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.logo{font-family:var(--display);font-size:clamp(5rem,22vw,8rem);line-height:.9;color:#fff;text-shadow:0 6px 0 var(--pink),0 12px 0 rgba(90,30,140,.25);letter-spacing:-.02em;transform:rotate(-4deg);display:inline-block}
.logo.sm{font-size:2.6rem;text-shadow:0 3px 0 var(--pink),0 6px 0 rgba(90,30,140,.2)}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.label{font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.label small{text-transform:none;letter-spacing:0;font-weight:700}
/* buttons */
.btn{--c:var(--pink);--d:#c8206a;background:var(--c);color:#fff;font-family:var(--display);font-size:1.15rem;padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 var(--d);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.big{font-size:1.4rem;padding:16px 20px;border-radius:20px}
.btn.small{font-size:.95rem;padding:7px 12px;border-radius:12px;box-shadow:0 3px 0 var(--d)}
.btn.blue{--c:var(--blue);--d:#1a6ad0}.btn.green{--c:var(--green);--d:#16a058}.btn.yellow{--c:var(--yellow);--d:#d0a010;color:var(--ink);text-shadow:none}
.btn.red{--c:var(--red);--d:#c02030}.btn.purple{--c:var(--purple);--d:#6a2ad0}.btn.ghost{--c:#f2eaff;--d:#d8c8f0;color:var(--ink);text-shadow:none}
.icon{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 4px 0 rgba(90,30,140,.18);font-size:1.3rem;display:grid;place-items:center;font-weight:900}
.icon.sm{width:34px;height:34px;font-size:1rem;border-radius:11px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#f2eaff;border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:11px;font-weight:900;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 3px 0 #e0d0f4}
.sw{width:52px;height:30px;border-radius:99px;background:#e0d4f0;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:.2s}
.sw[aria-checked=true]{background:var(--green)}.sw[aria-checked=true]::after{left:25px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.set input[type=range]{flex:1;max-width:200px;accent-color:var(--pink)}
/* auth */
.auth{max-width:420px;margin:0 auto;padding-top:6vh;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tag{font-weight:800;color:#5a2a8a;margin:0}
.auth .card{width:100%;text-align:left}
.auth label{display:flex;flex-direction:column;gap:5px;font-weight:900;font-size:.85rem;color:var(--muted)}
.auth input,.join input,.add-friend input,#chatIn,.dg-in input{border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;font-size:1.05rem;background:#fbf7ff;outline:none;width:100%;min-width:0}
.auth input:focus,.join input:focus,#chatIn:focus,.dg-in input:focus,.add-friend input:focus{border-color:var(--pink2)}
.err{color:var(--red);font-weight:800;margin:0;min-height:1.2em}
/* home */
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto 10px}
.top .logo{margin-right:auto}
.coins{background:#fff;border-radius:14px;padding:8px 12px;font-weight:900;box-shadow:0 4px 0 rgba(90,30,140,.18)}
.home,.room{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.me-card{flex-direction:row;align-items:center}
.mc-bean{flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
.mc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mc-info h2{font-size:1.7rem;overflow-wrap:anywhere}
.lvl{align-self:flex-start;background:var(--purple);color:#fff;font-weight:900;font-size:.8rem;border-radius:9px;padding:2px 9px}
.xpbar{height:12px;background:#f2eaff;border-radius:8px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:8px}
.mc-info small{color:var(--muted);font-weight:700}
.play-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.join{display:flex;gap:8px}.join input{text-align:center;font-family:var(--display);font-size:1.5rem;letter-spacing:.2em;text-transform:uppercase}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{position:relative;background:#fff;border-radius:20px;padding:14px 6px;box-shadow:var(--shadow);font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.88rem}
.tile span{font-size:2rem}.tile:active{transform:translateY(3px)}
.tile em{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;font-style:normal;border-radius:99px;min-width:20px;padding:0 6px;font-size:.75rem}
.t1{background:linear-gradient(160deg,#fff,#e0f4ff)}.t2{background:linear-gradient(160deg,#fff,#ffe0f2)}.t3{background:linear-gradient(160deg,#fff,#fff4cc)}.t4{background:linear-gradient(160deg,#fff,#e4ffe8)}
.fm{display:flex;align-items:center;gap:10px}.fm>div{flex:1;min-width:0;display:flex;flex-direction:column}.fm small{color:var(--muted);font-weight:700}.fm b{flex:1}
.dot.on{color:var(--green);font-weight:900;font-size:.8rem}
@media (max-width:560px){.play-btns{grid-template-columns:1fr}.tiles4{grid-template-columns:repeat(2,1fr)}}
/* room */
.room-code{flex:1;text-align:center;font-family:var(--display);font-size:2.2rem;letter-spacing:.18em;color:#fff;text-shadow:0 4px 0 var(--purple)}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pl{position:relative;background:#fbf7ff;border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border:3px solid transparent}
.pl.me{border-color:var(--pink2);background:#fff0f8}.pl b{font-size:.85rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl small{color:var(--muted);font-weight:800;font-size:.7rem}
.pl.empty{display:grid;place-items:center;min-height:120px;border:3px dashed #e8dcf8;background:transparent}.pl.empty span{font-family:var(--display);font-size:2rem;color:#e0d0f4}
.pl .crown{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:1.4rem;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.pl svg{animation:bob 2.4s ease-in-out infinite}.pl:nth-child(2n) svg{animation-delay:-.6s}.pl:nth-child(3n) svg{animation-delay:-1.2s}
.host-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.g-toggles{display:flex;flex-wrap:wrap;gap:6px}
.gt{border-radius:12px;padding:7px 10px;font-weight:800;font-size:.85rem;background:#f2eaff;border:2px solid transparent}
.gt:not(.off){background:#fff;border-color:currentColor}.gt.off{opacity:.45;text-decoration:line-through}
.cat-phys{color:#e0287a}.cat-draw{color:#7a3ad8}.cat-mash{color:#d06a00}.cat-react{color:#1a8a4a}.cat-race{color:#1a6ad0}.cat-social{color:#c02a2a}
.start-row{display:flex;flex-direction:column;align-items:center;gap:6px}.start-row .btn{width:100%}
@media (max-width:560px){.players{grid-template-columns:repeat(4,1fr);gap:6px}.pl svg{width:42px;height:55px}}
/* modals */
.modal{position:fixed;inset:0;z-index:50;background:rgba(60,20,100,.45);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.panel{background:#fff;border-radius:26px;padding:18px;width:min(460px,100%);max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(90,30,140,.25);animation:popin .25s cubic-bezier(.2,1.4,.4,1)}
.panel.wide{width:min(760px,100%)}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.ph{display:flex;align-items:center;gap:10px}.ph h2{flex:1;font-size:1.6rem}
.opt{text-align:left;background:#fbf7ff;border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:3px}.opt b{font-size:1.15rem}.opt span{color:var(--muted);font-weight:700}
.opt:hover{border-color:var(--pink2)}
.pub-list{display:flex;flex-direction:column;gap:8px}.pub{display:grid;grid-template-columns:1fr auto;text-align:left;background:#fbf7ff;border-radius:16px;padding:12px 14px}.pub span{color:var(--muted);font-weight:700;font-size:.85rem}
.pub em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-family:var(--display);font-size:1.4rem;letter-spacing:.1em;color:var(--purple)}
.ward{display:grid;grid-template-columns:200px 1fr;gap:14px}.ward-prev{display:flex;flex-direction:column;align-items:center;gap:10px;background:radial-gradient(circle at 50% 40%,#fff,#f2e4ff);border-radius:20px;padding:14px}
.ward-prev svg{animation:bob 2.4s ease-in-out infinite}.ward-shop{display:flex;flex-direction:column;gap:10px;min-width:0}
.ward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.wi{background:#fbf7ff;border:3px solid var(--line);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:800}
.wi.on{border-color:var(--green);background:#eafff2}.wi.locked{background:#f6f2fa}.wi.locked svg{opacity:.6}.wi span{color:#b07a00;font-weight:900}.wi[data-sure="1"]{border-color:var(--yellow);background:#fff8dc}
@media (max-width:560px){.ward{grid-template-columns:1fr}.ward-prev svg{width:110px;height:143px}}
.add-friend{display:flex;gap:8px}.f-list{display:flex;flex-direction:column;gap:8px}
.freq{display:flex;align-items:center;gap:8px;background:#fff8dc;border-radius:14px;padding:8px 10px;flex-wrap:wrap}.freq b{margin-right:auto}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat-grid div{background:#fbf7ff;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center}.stat-grid b{font-family:var(--display);font-size:1.6rem;font-weight:400}.stat-grid span{color:var(--muted);font-weight:800;font-size:.75rem}
.best{margin:0;font-weight:700}.g-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.g-stats div{display:flex;justify-content:space-between;background:#fbf7ff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.88rem}
.hist{display:flex;flex-direction:column;gap:6px}.h-row{display:flex;align-items:center;gap:10px;background:#fbf7ff;border-radius:14px;padding:8px 10px}.h-row>div{flex:1;min-width:0;display:flex;flex-direction:column}.h-row small{color:var(--muted);font-weight:700;font-size:.75rem}
.h-place{font-family:var(--display);font-size:1.2rem;width:48px;text-align:center}.h-place.p1{color:#d0a010}.h-place.p2{color:#8a9aaa}.h-place.p3{color:#c07a3a}.h-r{text-align:right;font-weight:900;display:flex;flex-direction:column}
.pm-head{display:flex;align-items:center;gap:12px}
/* chat + emotes */
.chat{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.chat>*{pointer-events:auto}
.chat-row{display:flex;gap:8px;align-items:center;position:relative}
.emotes{position:absolute;right:0;bottom:calc(100% + 8px);display:grid;grid-template-columns:repeat(4,42px);gap:4px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 6px 0 rgba(90,30,140,.2)}
.emotes button{font-size:1.4rem;width:42px;height:40px;border-radius:12px}.emotes button:active{background:#ffe0f2;transform:scale(1.2)}
.chat-btn{position:relative;width:52px;height:52px;border-radius:50%;background:var(--pink);box-shadow:0 5px 0 #c8206a;font-size:1.5rem}
.emo-btn{background:var(--yellow);box-shadow:0 5px 0 #d89a00}
/* in a match: sit top-right under the score bar so nothing covers controls or inputs */
.match:not([hidden]) ~ .chat{top:max(8px,env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right,0px));bottom:auto}
.match:not([hidden]) ~ .chat .chat-row{gap:6px}.match:not([hidden]) ~ .chat .chat-btn{width:38px;height:38px;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}.match:not([hidden]) ~ .chat .chat-btn em{min-width:18px;font-size:.7rem}
.match:not([hidden]) ~ .chat .emotes{bottom:auto;top:calc(100% + 8px)}
.match:not([hidden]) ~ .chat .chat-panel{bottom:auto;top:calc(56px + env(safe-area-inset-top,0px));height:min(300px,42dvh)}
.chat-btn em{position:absolute;top:-2px;right:-2px;background:var(--yellow);color:var(--ink);font-style:normal;font-weight:900;border-radius:99px;min-width:22px;font-size:.8rem;padding:0 6px}
.chat-panel{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:84px;width:min(340px,calc(100vw - 24px));height:min(380px,55dvh);background:#fff;border-radius:22px;box-shadow:0 8px 0 rgba(90,30,140,.25);display:flex;flex-direction:column;padding:10px;gap:8px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;min-height:0}
.cm{display:flex;align-items:flex-start;gap:5px;font-size:.92rem;overflow-wrap:anywhere}.cm b{color:var(--purple);white-space:nowrap}.cm.mine b{color:var(--pink)}.cm.sys{color:var(--muted);font-weight:700;font-size:.8rem;justify-content:center}
.cm svg{flex:0 0 auto}
#chatForm{display:flex;gap:6px}#chatIn{padding:9px 12px;font-size:.95rem}
.emo-pops{position:fixed;inset:0;pointer-events:none;z-index:45}
.emo-pop{position:absolute;bottom:90px;display:flex;flex-direction:column;align-items:center;animation:rise 2.4s ease-out forwards}.emo-pop span{font-size:3rem}.emo-pop small{background:#fff;border-radius:8px;padding:0 6px;font-weight:900}
@keyframes rise{to{transform:translateY(-55vh) scale(1.3);opacity:0}}
/* match */
.match{padding:0;position:relative;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.m-top{position:absolute;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:flex;align-items:center;gap:8px;pointer-events:none}
.m-top>*{pointer-events:auto}
#mRound{background:rgba(255,255,255,.9);border-radius:12px;padding:5px 10px;font-weight:900;font-size:.85rem}
.m-time{margin:0 0 0 6px;font-family:var(--display);font-size:1.8rem;color:#fff;text-shadow:0 3px 0 rgba(90,30,140,.5)}
#mBoard{margin-left:auto}
.stage{position:absolute;inset:0;overflow:hidden}
.stage3d{display:block;touch-action:none}
.labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag3d{position:absolute;left:0;top:0;background:rgba(255,255,255,.88);border-radius:8px;padding:1px 7px;font-weight:900;font-size:.72rem;white-space:nowrap}
.tag3d.me{background:var(--yellow)}
.emo3d{position:absolute;left:0;top:0;font-size:2.2rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.ovl{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:60px 14px 20px;overflow-y:auto}
.vote-ovl,.result-ovl,.final-ovl{background:linear-gradient(160deg,rgba(255,184,230,.96),rgba(201,176,255,.96) 50%,rgba(154,224,255,.96))}
.intro-ovl{background:rgba(42,26,74,.55);backdrop-filter:blur(4px)}
.vote,.result,.final{width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.vote h2,.result h2{font-size:2rem;color:#fff;text-shadow:0 4px 0 var(--purple)}
.vote-t{font-family:var(--display);font-size:2.4rem;width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 0 rgba(90,30,140,.2)}
.vote-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.vote-card{background:#fff;border-radius:22px;padding:16px 10px;box-shadow:0 6px 0 rgba(90,30,140,.2);display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid transparent;transition:transform .15s}
.vote-card:hover{transform:translateY(-3px)}.vote-card.mine{border-color:currentColor;transform:scale(1.04)}
.vc-ic{font-size:3rem}.vote-card b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--ink)}.vote-card small{color:var(--muted);font-weight:700;font-size:.8rem}
.vc-who{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:26px}
@media (max-width:560px){.vote-opts{grid-template-columns:1fr}.vote-card{flex-direction:row;text-align:left;padding:10px 12px}.vote-card .vc-ic{font-size:2.2rem}.vote-card small{display:none}.vc-who{margin-left:auto}}
.mini-board{background:rgba(255,255,255,.85);border-radius:18px;padding:8px;width:min(420px,100%);display:flex;flex-direction:column;gap:3px}
.mb-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:2px 6px;border-radius:10px}.mb-row.me{background:#fff4c8}.mb-row b{flex:1;text-align:left}.mb-p{width:20px;color:var(--muted)}.mb-s{font-family:var(--display);font-size:1.1rem}
.intro{background:#fff;border-radius:28px;padding:22px;width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 10px 0 rgba(42,26,74,.35);animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
.in-ic{font-size:4rem;animation:bob 1.6s ease-in-out infinite}.intro h1{font-size:2.4rem;color:currentColor}
.intro ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--ink);font-weight:700}
.intro li{background:#fbf7ff;border-radius:12px;padding:8px 12px}
.in-note{margin:0;background:#fff4c8;border-radius:12px;padding:8px 12px;font-weight:800;color:var(--ink)}

  timeout(G){ return this.rankOf(G); },
  bot(G, id){ const B = G.bots[id] || (G.bots[id] = { done:{} }), r = G.res[id]; if(!r || r.out != null) return null;
    G.seq.forEach((L, i) => { if(B.done[i] || G.t < L[0]) return; B.done[i] = 1; if(L[2]){ if(rand() < .035) setTimeout(() => this.onEvent(G, id, { e:"red", i }), 400); } else if(rand() < .9){ const ms = 280 + rand()*480; if(ms / 1000 < L[3]) setTimeout(() => this.onEvent(G, id, { e:"hit", i, ms }), ms); } });
    return null; },
  drop(G, id){ if(G.res[id] && G.res[id].out == null) G.res[id].out = G.t; },
  snap(G){ const o = {}; for(const id in G.res){ const r = G.res[id]; o[id] = [r.s, 3 - r.miss, r.out != null ? 1 : 0]; } return { r:o, t:+G.t.toFixed(1) }; },
  view(root, ctx){
    ctlShow(null); const seq = ctx.info.seq, v = { tapped:{}, out:false };
    root.innerHTML = `<div class="red"><div class="red-top"><span id="redScore">0</span><span id="redLives">❤️❤️❤️</span></div><div class="red-grid" id="redGrid">${Array.from({ length:9 }, (_, i) => `<button class="rb" data-c="${i}"></button>`).join("")}</div><div class="red-board" id="redBoard"></div><div class="red-out" id="redOut" hidden></div></div>`;
    const cells = $$("#redGrid .rb");
    const active = tt => { const a = {}; seq.forEach((L, i) => { if(tt >= L[0] && tt < L[0] + L[3]) a[L[1]] = i; }); return a; };
    cells.forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); if(CM.phase !== "play" || v.out) return; const tt = now() - CM.playT, c = +b.dataset.c, i = active(tt)[c]; if(i == null || v.tapped[i]) return;
      v.tapped[i] = 1; const L = seq[i]; if(L[2]){ ctx.input({ e:"red", i }); b.classList.add("boom"); sfx.boom(); v.out = true; } else { const ms = Math.round((tt - L[0]) * 1000); ctx.input({ e:"hit", i, ms }); b.classList.add("good"); sfx.coin(); setTimeout(() => b.classList.remove("good"), 250); } }));
    v.update = s => {
      const tt = CM.phase === "play" ? now() - CM.playT : -1, a = active(tt);
      cells.forEach((b, c) => { const i = a[c], st = i == null || v.tapped[i] ? "" : seq[i][2] ? "r" : "g"; if(b.dataset.s !== st){ b.dataset.s = st; b.className = "rb" + (st === "g" ? " on-g" : st === "r" ? " on-r" : ""); } });
      const me = s.r && s.r[ctx.me]; if(me){ $("#redScore").textContent = me[0]; $("#redLives").textContent = "❤️".repeat(Math.max(0, me[1])) + "🖤".repeat(3 - Math.max(0, me[1]));
        if(me[2] && !v.shownOut){ v.shownOut = true; v.out = true; const o = $("#redOut"); o.hidden = false; o.innerHTML = `<b>OUT!</b><span>${me[1] <= 0 ? "Missed 3 greens" : "You pressed red"} · ${me[0]} pts</span>`; sfx.lose(); } }
      if(s.r){ const k = JSON.stringify(s.r); if(v.k !== k){ v.k = k; $("#redBoard").innerHTML = Object.entries(s.r).sort((x, y) => y[1][0] - x[1][0]).map(([id, r]) => `<span class="${r[2] ? "dead" : ""} ${id === ctx.me ? "me" : ""}">${beanSVG(playerOf(id)?.bean, 14)}${esc(id)} <b>${r[0]}</b></span>`).join(""); } }
    };
    v.destroy = () => {}; return v;
  }
};

// ===================== screens: login, home, wardrobe, friends, stats, lobby, chat =====================
const PRICE = id => SHOP[id];
const linkCode = (location.pathname.match(/^\/r\/([a-z]{4})/i) || [])[1];
// ---------- login ----------
let authMode = "login";
function showAuth(){ show("authScreen"); $("#chat").hidden = true; }
$("#authSeg").onclick = e => { const b = e.target.closest("button"); if(!b) return; authMode = b.dataset.m; $$("#authSeg button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#aGo").textContent = authMode === "login" ? "Log in" : "Create account"; $("#aPass").autocomplete = authMode === "login" ? "current-password" : "new-password"; };
$("#aGo").onclick = async () => { const name = $("#aName").value.trim(), pass = $("#aPass").value; $("#aErr").textContent = ""; $("#aGo").disabled = true;
  const j = await api(authMode, { name, pass }); $("#aGo").disabled = false;
  if(j.error){ $("#aErr").textContent = j.error; sfx.wrong(); return; } STORE.token = j.token; saveStore(); ME = j.me; sfx.win(); afterLogin(); };
$("#aPass").addEventListener("keydown", e => { if(e.key === "Enter") $("#aGo").click(); });
async function afterLogin(){ await refreshMe(); show("homeScreen"); SND.music("lobby"); const c = linkCode || STORE.pendingCode; STORE.pendingCode = null; saveStore(); if(c) enterRoom(c.toUpperCase(), false); }
// ---------- home ----------

}
$("#hFriendsMini").onclick = e => { const b = e.target.closest("[data-join]"); if(b) enterRoom(b.dataset.join, false); };
$("#hCreate").onclick = () => { sfx.click(); modal("#createModal"); };
$$("#createModal .opt").forEach(b => b.onclick = () => { modal("#createModal", false); enterRoom(newCode(), true, b.dataset.pub === "1"); });
$("#hJoinForm").onsubmit = e => { e.preventDefault(); const c = $("#hCode").value.trim().toUpperCase(); if(!/^[A-Z]{4}$/.test(c)) return toast("Room codes are 4 letters"); enterRoom(c, false); };
$("#hCode").addEventListener("input", e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ""));
$("#hPublic").onclick = () => { modal("#publicModal"); loadPublic(); };
$("#pubRefresh").onclick = loadPublic;
async function loadPublic(){ $("#pubList").innerHTML = `<p class="muted">Loading…</p>`; const j = await api("rooms");
  $("#pubList").innerHTML = (j.rooms || []).length ? j.rooms.map(r => `<button class="pub" data-join="${r.code}"><b>${esc(r.host)}'s room</b><span>${r.n}/8 · ${r.status === "playing" ? "playing now" : "in the lobby"}</span><em>${r.code}</em></button>`).join("") : `<p class="muted">No public rooms right now. Make one!</p>`;
  $$("#pubList [data-join]").forEach(b => b.onclick = () => { modal("#publicModal", false); enterRoom(b.dataset.join, false); }); }
// ---------- wardrobe ----------
let wTab = "col", wSel = null;
$("#hWardrobe").onclick = () => { wSel = Object.assign({}, ME.bean); modal("#wardModal"); renderWard(); };
$("#wTabs").onclick = e => { const b = e.target.closest("button"); if(!b) return; wTab = b.dataset.s; $$("#wTabs button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderWard(); };
function renderWard(){
  $("#wCoins").textContent = `🪙 ${fmt(ME.coins)}`; $("#wPrev").innerHTML = beanSVG(wSel, 150, { mood:"happy" }) + `<button class="btn green" id="wSave">Wear this</button>`;
  let items = [];
  if(wTab === "col") items = FREE_COLS.map(c => ({ id:c, col:c, free:true })).concat(Object.keys(ITEMS).filter(k => ITEMS[k].s === "col").map(k => ({ id:k, col:k })));
  else items = [{ id:"", none:true }].concat(Object.keys(ITEMS).filter(k => ITEMS[k].s === wTab).map(k => ({ id:k })));
  $("#wGrid").innerHTML = items.map(it => { const owned = it.free || it.none || ME.own[it.id], on = wTab === "col" ? wSel.col === it.id : (wSel[wTab] || "") === it.id;
    const prevBean = Object.assign({}, wSel, wTab === "col" ? { col:it.id } : { [wTab]:it.id });
    return `<button class="wi ${on ? "on" : ""} ${owned ? "" : "locked"}" data-id="${it.id}">${beanSVG(prevBean, 46)}<b>${it.none ? "None" : it.free ? "" : ITEMS[it.id].n}</b>${owned ? "" : `<span>🪙 ${fmt(PRICE(it.id) || 0)}</span>`}</button>`; }).join("");
  $("#wSave").onclick = async () => { const j = await api("bean", { bean:wSel }); if(j.error) return toast(j.error); ME = j.me; sfx.win(); toast("Looking good!"); renderHome(); modal("#wardModal", false); if(NET.room) toast("Rejoin the room to show your new look to everyone"); };
}
$("#wGrid").onclick = async e => { const b = e.target.closest(".wi"); if(!b) return; const id = b.dataset.id;
  if(b.classList.contains("locked")){ if(b.dataset.sure !== "1"){ $$(".wi").forEach(x => delete x.dataset.sure); b.dataset.sure = "1"; b.querySelector("span").textContent = "Tap to buy"; sfx.click(); return; }
    const j = await api("buy", { item:id }); if(j.error){ sfx.wrong(); return toast(j.error); } ME = j.me; sfx.coin(); toast(`Bought ${ITEMS[id].n}!`); }
  if(wTab === "col") wSel.col = id; else wSel[wTab] = id; sfx.pop(); renderWard(); };
// ---------- friends ----------
$("#hFriends").onclick = () => { modal("#friendsModal"); renderFriends(); };
function renderFriends(){
  $("#fReqs").innerHTML = (ME.reqs || []).map(n => `<div class="freq"><b>${esc(n)}</b> wants to be friends <button class="btn small green" data-acc="${esc(n)}">Accept</button><button class="btn small ghost" data-dec="${esc(n)}">No</button></div>`).join("");
  $("#fList").innerHTML = FRIENDS.length ? FRIENDS.sort((a, b) => b.online - a.online).map(f => `<div class="fm">${beanSVG(f.bean, 30)}<div><b>${esc(f.name)}</b><small>Level ${f.lvl} · ${f.online ? (f.room ? "in room " + f.room : "online") : "offline"}</small></div>${f.room ? `<button class="btn small blue" data-join="${f.room}">Join</button>` : ""}<button class="icon sm" data-rem="${esc(f.name)}" title="Remove">✕</button></div>`).join("") : `<p class="muted">No friends yet. Add someone by their username.</p>`;
}
$("#friendsModal").addEventListener("click", async e => { const t = e.target.closest("[data-acc],[data-dec],[data-rem],[data-join]"); if(!t) return;
  if(t.dataset.join){ modal("#friendsModal", false); return enterRoom(t.dataset.join, false); }
  const action = t.dataset.acc ? "accept" : t.dataset.dec ? "decline" : "remove", name = t.dataset.acc || t.dataset.dec || t.dataset.rem;
  if(action === "remove" && t.dataset.sure !== "1"){ t.dataset.sure = "1"; t.textContent = "Sure?"; return; }
  const j = await api("friend", { action, name }); if(j.error) toast(j.error); await refreshMe(); renderFriends(); });
$("#fAdd").onsubmit = async e => { e.preventDefault(); const n = $("#fName").value.trim(); if(!n) return; const j = await api("friend", { action:"add", name:n }); if(j.error) return toast(j.error); $("#fName").value = ""; toast("Friend request sent!"); sfx.ding(); await refreshMe(); renderFriends(); };
// ---------- stats ----------
$("#hStats").onclick = () => { modal("#statsModal"); renderStats(); };
function renderStats(){
  const g = ME.games || {}, rows = Object.keys(GAMES).map(id => { const s = g[id] || { p:0, w:0 }; return { id, p:s.p, w:s.w }; }).sort((a, b) => b.w - a.w || b.p - a.p);
  const best = rows.find(r => r.p > 0);
  $("#statsBody").innerHTML = `<div class="stat-grid"><div><b>${ME.matches}</b><span>Matches</span></div><div><b>${ME.wins}</b><span>Wins</span></div><div><b>${ME.matches ? Math.round(ME.wins / ME.matches * 100) : 0}%</b><span>Win rate</span></div><div><b>${ME.rounds || 0}</b><span>Rounds</span></div></div>
    ${best ? `<p class="best">Best game: <b>${GAMES[best.id].icon} ${GAMES[best.id].name}</b> (${best.w} wins)</p>` : ""}
    <div class="label">Every game</div><div class="g-stats">${rows.map(r => `<div><span>${GAMES[r.id].icon} ${GAMES[r.id].name}</span><b>${r.w}/${r.p}</b></div>`).join("")}</div>
    <div class="label">Recent matches</div><div class="hist">${(ME.hist || []).length ? ME.hist.map(h => `<div class="h-row"><span class="h-place p${Math.min(h.place, 4)}">${ordinal(h.place)}</span><div><b>${h.place === 1 ? "Won" : "Played"} vs ${h.n - 1} other${h.n === 2 ? "" : "s"}</b><small>${(h.board || []).slice(0, 4).map(b => `${esc(b.name)} ${b.pts}`).join(" · ")}</small></div><span class="h-r">+${h.coins}🪙<small>${timeAgo(h.t)}</small></span></div>`).join("") : `<p class="muted">No matches yet. Go play!</p>`}</div>`;
}
// ---------- settings ----------
function syncSet(){ $("#sMusic").setAttribute("aria-checked", !!STORE.music); $("#sSound").setAttribute("aria-checked", !!STORE.sound); $("#sVoice").setAttribute("aria-checked", !!STORE.voice); $("#sVol").value = Math.round(STORE.vol * 100); }
$("#hSettings").onclick = () => { syncSet(); modal("#setModal"); };
[["#sMusic", "music"], ["#sSound", "sound"], ["#sVoice", "voice"]].forEach(([s, k]) => $(s).onclick = () => { STORE[k] = !STORE[k]; saveStore(); syncSet(); sfx.click(); });
$("#sVol").oninput = e => SND.setVol(e.target.value / 100);
$("#sLogout").onclick = async () => { await api("logout"); STORE.token = null; saveStore(); leaveRoom(true); modal("#setModal", false); showAuth(); };
// ---------- the room lobby ----------
function enterRoom(code, create, pub){ if(!ME) { STORE.pendingCode = code; saveStore(); return showAuth(); } history.replaceState(null, "", "/r/" + code); joinRoom(code, { create, pub }); $("#rCode").textContent = code; show("roomScreen"); $("#rPlayers").innerHTML = `<p class="muted">Connecting…</p>`; $("#rSettings").innerHTML = ""; $("#chat").hidden = false; chatLog = []; renderChat(); }
on("room", r => { if(!CM.phase) show("roomScreen"); renderRoom(); if(!CM.phase) SND.music("lobby"); });
on("fatal", () => { history.replaceState(null, "", "/"); leaveRoom(true); HM = null; stageClear(); ovl(""); CM.phase = ""; $("#chat").hidden = true; show("homeScreen"); SND.music("lobby"); refreshMe(); });
on("reconnecting", () => toast("Reconnecting…", 1500));
$("#rLeave").onclick = () => { if($("#rLeave").dataset.sure !== "1" && NET.room && NET.room.status === "playing"){ $("#rLeave").dataset.sure = "1"; toast("Tap again to leave the match"); setTimeout(() => delete $("#rLeave").dataset.sure, 3000); return; }
  leaveRoom(); HM = null; history.replaceState(null, "", "/"); $("#chat").hidden = true; show("homeScreen"); refreshMe(true); };
$("#rShare").onclick = () => { const url = `${location.origin}/r/${NET.code}`; if(navigator.share) navigator.share({ title:"Join my cpk room", text:`Join my cpk party! Code ${NET.code}`, url }).catch(() => copyText(url)); else copyText(url); };
function renderRoom(){
  const r = NET.room; if(!r) return; $("#rCode").textContent = r.code; const host = NET.host;
  $("#rPlayers").innerHTML = r.players.map(p => `<button class="pl ${p.id === NET.me ? "me" : ""}" data-p="${esc(p.id)}">${p.id === r.host ? `<span class="crown">👑</span>` : ""}${beanSVG(p.bean, 54)}<b>${esc(p.name)}</b><small>${p.bot ? "🤖 bot" : "Lv " + p.lvl}</small></button>`).join("") + Array.from({ length:Math.max(0, 8 - r.players.length) }, () => `<div class="pl empty"><span>?</span></div>`).join("");
  $("#rHostRow").innerHTML = host ? `<button class="btn small blue" id="rBotAdd" ${r.players.length >= 8 ? "disabled" : ""}>🤖 Add bot</button><button class="btn small ghost" id="rBotRem" ${r.players.some(p => p.bot) ? "" : "disabled"}>Remove bot</button><button class="btn small ${r.locked ? "yellow" : "ghost"}" id="rLock">${r.locked ? "🔒 Locked" : "🔓 Open"}</button>` : `<small class="muted">${esc(r.host)} is the host · ${r.pub ? "🌍 public room" : "🔒 private room"}</small>`;
  $("#rSettings").hidden = !host;
  if(host){ const off = r.off || [];
    $("#rSettings").innerHTML = `<div class="label">Rounds</div><div class="seg" id="rRounds">${[5, 10, 15].map(n => `<button data-n="${n}" aria-pressed="${r.rounds === n}">${n}</button>`).join("")}</div>
      <div class="set"><span>🌍 Public room</span><button class="sw" id="rPub" aria-checked="${!!r.pub}"></button></div>
      <div class="label">Games (${Object.keys(GAMES).length - off.filter(x => GAMES[x]).length} on) <small>tap to turn off</small></div><div class="g-toggles">${Object.entries(GAMES).map(([id, g]) => `<button class="gt cat-${g.cat} ${off.includes(id) ? "off" : ""}" data-g="${id}">${g.icon} ${g.name}</button>`).join("")}</div>`;
    $$("#rRounds button").forEach(b => b.onclick = () => { send("settings", { rounds:+b.dataset.n }); sfx.click(); });
    $("#rPub").onclick = () => send("settings", { pub:!r.pub });
    $$(".gt").forEach(b => b.onclick = () => { const id = b.dataset.g, o = off.includes(id) ? off.filter(x => x !== id) : off.concat(id); if(Object.keys(GAMES).every(k => o.includes(k))) return toast("Leave at least one game on"); send("settings", { off:o }); sfx.click(); });
    $("#rBotAdd").onclick = () => send("bot", { add:true }); $("#rBotRem").onclick = () => send("bot", { add:false });
    $("#rLock").onclick = () => send("lock", { on:!r.locked }); }
  $("#rStart").hidden = !host; $("#rWait").hidden = host || r.status === "playing"; $("#rStart").disabled = r.players.length < 2 || r.status === "playing";
  $("#rStart").textContent = r.players.length < 2 ? "Need 2+ players (add a bot!)" : "▶ Start the party";
}
$("#rStart").onclick = () => { sfx.click(); startMatch(); };
$("#rPlayers").onclick = e => { const b = e.target.closest("[data-p]"); if(!b) return; const id = b.dataset.p, p = playerOf(id); if(!p) return;
  const host = NET.host, me = id === NET.me;
  $("#pMenuBody").innerHTML = `<div class="pm-head">${beanSVG(p.bean, 70)}<div><h2>${esc(p.name)}</h2><small>${p.bot ? "Bot" : "Level " + p.lvl}</small></div></div>
    ${!me && !p.bot ? `<button class="btn blue" data-pa="friend">👯 Add friend</button>` : ""}
    ${host && !me && !p.bot ? `<button class="btn yellow" data-pa="pass">👑 Make host</button>` : ""}
    ${host && !me ? `<button class="btn red" data-pa="kick">🚪 Kick</button>` : ""}<button class="btn ghost" data-close>Close</button>`;
  modal("#pMenu"); $$("#pMenuBody [data-pa]").forEach(x => x.onclick = async () => { const a = x.dataset.pa; modal("#pMenu", false);
    if(a === "friend"){ const j = await api("friend", { action:"add", name:id }); toast(j.error || "Friend request sent!"); }
    if(a === "pass") send("pass", { id }); if(a === "kick") send(p.bot ? "bot" : "kick", p.bot ? { add:false, id } : { id }); }); };
// ---------- chat + emotes ----------
let chatLog = [], chatUnread = 0;
const EMOTES = ["😂", "🔥", "💀", "👏", "😭", "🤡", "😎", "❤️", "😡", "🫡"];
$("#emotes").innerHTML = EMOTES.map(e => `<button data-e="${e}">${e}</button>`).join("");
$("#emotes").onclick = e => { const b = e.target.closest("[data-e]"); if(!b) return; $("#emotes").hidden = true; const t = Date.now(); if(t - (window._emT || 0) < 600) return; window._emT = t; send("emote", { e:b.dataset.e }); };
$("#emoBtn").onclick = () => { const em = $("#emotes"); em.hidden = !em.hidden; if(!em.hidden) $("#chatPanel").hidden = true; };
$("#chatBtn").onclick = () => { const p = $("#chatPanel"); p.hidden = !p.hidden; $("#emotes").hidden = true; if(!p.hidden){ chatUnread = 0; renderChat(); $("#chatIn").focus(); } };
$("#chatForm").onsubmit = e => { e.preventDefault(); const t = $("#chatIn").value.trim(); if(!t) return; send("chat", { text:t }); $("#chatIn").value = ""; };
on("chat", m => { chatLog.push(m); if(chatLog.length > 80) chatLog.shift(); if($("#chatPanel").hidden){ chatUnread++; sfx.chat(); } renderChat(); });
on("sys", m => { chatLog.push({ sys:1, text:m.msg }); renderChat(); });
on("emote", m => { sfx.pop(); if(CM.view && CM.view.S) return; const d = document.createElement("div"); d.className = "emo-pop"; d.style.left = (10 + rand()*75) + "%"; d.innerHTML = `<span>${esc(m.e)}</span><small>${esc(m.id)}</small>`; $("#emoPops").appendChild(d); setTimeout(() => d.remove(), 2400); });
function renderChat(){ $("#chatN").hidden = !chatUnread; $("#chatN").textContent = chatUnread;
  $("#chatMsgs").innerHTML = chatLog.length ? chatLog.map(m => m.sys ? `<div class="cm sys">${esc(m.text)}</div>` : `<div class="cm ${m.id === NET.me ? "mine" : ""}">${beanSVG(playerOf(m.id)?.bean, 18)}<b>${esc(m.id)}</b> ${esc(m.text)}</div>`).join("") : `<div class="cm sys">Say hi 👋</div>`;
  $("#chatMsgs").scrollTop = 1e6; }
$("#mBoard").onclick = () => toast(Object.keys(CM.scores || {}).filter(id => playerOf(id)).sort((a, b) => CM.scores[b] - CM.scores[a]).map((id, i) => `${i + 1}. ${id} ${CM.scores[id]}`).join("   ") || "No scores yet", 4000);
// ---------- start up ----------
setInterval(() => { if(ME && !document.hidden) refreshMe(); }, 30000);
(async () => {
  if(!STORE.token){ if(linkCode){ STORE.pendingCode = linkCode; saveStore(); } showAuth(); return; }
  const j = await refreshMe(); if(j.error){ showAuth(); return; } afterLogin();
})();

})();</script></body></html>
